basePath: /api/v1
definitions:
  handler.CreateTeamRequest:
    properties:
      name:
        example: Backend
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  handler.ErrorResponse:
    properties:
      code:
        example: invalid_request
        type: string
      message:
        example: invalid request
        type: string
    type: object
  handler.InviteRequest:
    properties:
      email:
        example: bob@example.com
        maxLength: 254
        type: string
      role:
        default: member
        enum:
        - admin
        - member
        example: member
        type: string
    required:
    - email
    type: object
  handler.LoginRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: local-password
        type: string
    required:
    - email
    - password
    type: object
  handler.MembershipResponse:
    properties:
      role:
        enum:
        - admin
        - member
        example: member
        type: string
      team_id:
        example: 1
        type: integer
      user_id:
        example: 2
        type: integer
    type: object
  handler.RegisterRequest:
    properties:
      email:
        example: alice@example.com
        maxLength: 254
        type: string
      name:
        example: Alice
        maxLength: 255
        minLength: 1
        type: string
      password:
        example: local-password
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.TeamResponse:
    properties:
      created_at:
        type: string
      created_by:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: Backend
        type: string
      role:
        enum:
        - owner
        - admin
        - member
        example: owner
        type: string
    type: object
  handler.TeamsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.TeamResponse'
        type: array
    type: object
  handler.TokenResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  handler.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: alice@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Alice
        type: string
    type: object
info:
  contact: {}
  description: Team task management API.
  title: Secunda API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Authenticate and issue a JWT
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /teams:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TeamsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the current user's teams
      tags:
      - teams
    post:
      consumes:
      - application/json
      parameters:
      - description: Team
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateTeamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.TeamResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a team with the current user as owner
      tags:
      - teams
  /teams/{id}/invite:
    post:
      consumes:
      - application/json
      description: Owner may invite an admin or member. Admin may invite a member.
        Repeated invitations return 409 without changing the role.
      parameters:
      - description: Team ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Invitation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.InviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.MembershipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a registered user to a team
      tags:
      - teams
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
